name: ci
on:
  push:
    branches: [main]
jobs:
  scope-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-scope.js --dry-run

  ci-success:
    needs: [scope-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          R_SCOPE: ${{ needs.scope-check.result }}
        run: |
          if [ "$R_SCOPE" = "failure" ]; then
            echo "scope-check failed."
            exit 1
          fi
          echo "All checks passed."
